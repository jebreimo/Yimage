name: CMake

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/../vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v4

      # Provides CMake and Ninja.
      - uses: lukka/get-cmake@latest

      # Ninja on Windows needs the MSVC environment (cl.exe, INCLUDE, LIB).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # A full clone, so vcpkg can resolve the builtin-baseline in vcpkg.json.
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "${{ github.workspace }}/../vcpkg-cache"

      # Caches the built packages, so dependencies are only rebuilt when
      # vcpkg.json changes.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure
